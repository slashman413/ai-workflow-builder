name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Coverage gate (>= 90% line)
        run: node scripts/security/coverage-gate.mjs 90

      - name: Build web bundle
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  security:
    name: Security Gate (audit + secret scan + OSV)
    # Runs in parallel with CI on every push/PR; the deploy jobs depend on
    # BOTH ci and security being green.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security gate
        run: bash scripts/security/security-gate.sh

  deploy-web:
    name: Deploy SPA to Cloudflare Pages
    # Only deploy real pushes to main, never PRs, and only after CI is green.
    # The secrets guard keeps the pipeline green until the Pages token/account
    # are configured (then this job activates automatically).
    needs: [ci, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle (with production API base)
        run: npm run build
        env:
          # The SPA calls the container API on its own origin in production.
          VITE_API_URL: https://api.workflow-builders.com/api
          # Clerk publishable key (Frontend API key) — enables real session
          # auth + OAuth in the deployed SPA. Set as a repo secret; without
          # it the SPA still builds but renders the dev auth shell.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ai-workflow-builder-web
          directory: web/dist
          branch: main

  deploy-api:
    name: Deploy API container to Fly.io
    # Runs in parallel with deploy-web, gated on the same green CI and the
    # Fly token being configured.
    needs: [ci, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.FLY_API_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
