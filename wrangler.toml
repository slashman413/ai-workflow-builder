# wrangler.toml — Cloudflare Pages configuration for the workflow-builders.com landing page.
#
# The demo site is a **static landing page** (web/landing/) served from the
# Pages edge CDN. It has no Clerk, no API origin, and no runtime secrets.
# The product itself is self-hosted by buyers (see docs/deployment-guide.md).
#
# CI deploys through cloudflare/wrangler-action (see .github/workflows/ci-cd.yml):
#
#   wrangler pages deploy web/landing --project-name ai-workflow-builder-web
#
# This file is the declarative Pages project config; keep the project name and
# output dir in sync with the CI command above.

name = "ai-workflow-builder-web"
compatibility_date = "2026-08-01"
pages_build_output_dir = "web/landing"

# No Workers/Pages Functions: the landing page is pure static HTML/CSS.
