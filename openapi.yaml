openapi: 3.1.0
info:
  title: ai-workflow-builder API
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    HTTP contract for the `@ai-workflow-builder/server` Express 4 service that
    powers workflow-builders.com.

    Turn a single natural-language prompt into a validated multi-agent workflow.
    Ambiguity is resolved by a deterministic **Grill-Me** spec loop *before* a
    workflow is scaffolded, and workflows are only persisted once they pass the
    aggregate's invariants (unique ids, resolvable dependencies, acyclic).

    This document was regenerated from the actual route table
    (`server/src/adapters/http/routes.js`) and the domain shapes it serves. It
    supersedes the earlier `/api/v1/agents|workflows` design, which described a
    deprecated Python/FastAPI product that no longer exists.

    ## Resource model
    The real aggregate root is a **Project** (`{ prompt, answers, spec }`). Each
    project has at most one compiled **Workflow**. There is no top-level
    `/agents` or `/workflows` collection.

    ## Lifecycle
    `POST /api/projects` (prompt) → `GET .../grill` → `POST .../answers`
    (repeat until `ready: true`) → `POST .../workflow/scaffold` →
    `PUT .../workflow` (edit + validate).

    ## Authentication & tenant isolation
    Every endpoint except `/api/health` requires a Clerk session JWT sent as
    `Authorization: Bearer <session token>`. The server verifies the token
    cryptographically (`@clerk/backend`), extracts the `org_id` claim, and
    scopes every query to that organization — cross-tenant access to a
    resource behaves exactly like a missing resource (HTTP 404). RBAC:
    `org:owner`/`org:admin` = Owner, `org:architect`/`org:editor` = Architect,
    `org:viewer`/`org:member` = Viewer. Writes require Architect+, deletes
    require Owner, and the key vault is Architect+ for all operations.

    ## Key vault
    `POST /api/vault` stores LLM provider keys (OpenAI/Anthropic/Gemini/DeepSeek) with
    envelope encryption: a per-organization Data Encryption Key (DEK) wraps the
    provider key, and the DEK itself is wrapped by an environment Key
    Encryption Key (KEK, `VAULT_KEK`). Read endpoints return **masked labels
    only** (`maskedKey` like `sk-abc…wxyz`); plaintext keys and wrapped
    material never appear in any response.

servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.workflow-builders.com
    description: Production (behind Cloudflare + Clerk edge auth)

tags:
  - name: system
    description: Liveness and operational endpoints
  - name: projects
    description: Project lifecycle (prompt → spec)
  - name: grill
    description: The deterministic Grill-Me clarification loop
  - name: workflow
    description: Compiled workflow scaffold, validation, and persistence
  - name: vault
    description: Envelope-encrypted LLM provider key vault
  - name: catalog
    description: Ecosystem catalogs (agency-agents personas, nuwa-skill lenses)

# Everything except /api/health requires a Clerk session JWT (see
# Authentication above). /api/health overrides with `security: []`.
security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [system]
      summary: Liveness and readiness probe
      operationId: health
      security: []
      description: >
        Returns operational status, service identity, process uptime, and a
        live database readiness check (a `SELECT 1` round-trip on the SQLite
        adapter). Responds 200 while the service can serve traffic and 503
        (status `degraded`) when the database is unreachable, so orchestrators
        (Docker HEALTHCHECK, Fly.io/Railway rolling deploys) can fail over or
        restart the instance. Deliberately public — no session required.
      responses:
        '200':
          description: Service is up and the database answers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Service is up but the database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/projects:
    post:
      tags: [projects]
      summary: Create a project from a one-line prompt
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: The one-line natural-language prompt.
                  example: summarise my emails
      responses:
        '201':
          description: Project created; an initial spec snapshot is derived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: Prompt missing or not a non-empty string (`INVALID_PROMPT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [projects]
      summary: List all projects
      operationId: listProjects
      responses:
        '200':
          description: Projects, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Get a project
      operationId: getProject
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects]
      summary: Delete a project (cascades to its workflow)
      operationId: deleteProject
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, const: true }
                  id: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/grill:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [grill]
      summary: Get the next Grill-Me questions and readiness
      operationId: grill
      parameters:
        - name: deep
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
          description: >
            When `true`, also surface non-critical questions for dimensions that
            are already covered. Any value other than the literal string `true`
            is treated as false.
      responses:
        '200':
          description: Open questions plus per-dimension coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrillResult' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/answers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [grill]
      summary: Submit answers to grill questions
      operationId: answer
      description: >
        Merges the given answers into the project, re-derives the spec, and
        returns the updated project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties: { type: string }
                  description: Map of questionId → free-text answer.
                  example:
                    goal.outcome: a daily digest
                    inputs.source: my inbox
                    outputs.shape: markdown
                    success.measure: nothing urgent missed
      responses:
        '200':
          description: The updated project with a re-derived spec.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: '`answers` is missing or not a plain object (`INVALID_ANSWERS`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/workflow/scaffold:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [workflow]
      summary: Compile the current spec into a starter workflow
      operationId: scaffoldWorkflow
      description: >
        Refuses with 409 unless the spec is ready, protecting against building
        on an under-specified spec. Pass `force: true` to override.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Scaffold even if the spec is not ready.
      responses:
        '201':
          description: The scaffolded and persisted workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '409':
          description: Spec still has open questions (`SPEC_NOT_READY`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/workflow:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [workflow]
      summary: Get the project's saved workflow
      operationId: getWorkflow
      responses:
        '200':
          description: The workflow, or `null` if none has been scaffolded/saved yet.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Workflow' }
                  - { type: 'null' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [workflow]
      summary: Persist a user-edited workflow after validation
      operationId: saveWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow: { $ref: '#/components/schemas/Workflow' }
      responses:
        '200':
          description: The persisted workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '422':
          description: Workflow failed invariant validation (`INVALID_WORKFLOW`). `details` lists every violation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vault:
    get:
      tags: [vault]
      summary: List the org's stored provider keys (masked labels only)
      operationId: listVaultKeys
      description: >
        Returns masked labels and metadata for every vault entry in the
        caller's organization. Plaintext keys and wrapped key material are
        never returned.
      responses:
        '200':
          description: Masked vault entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultEntry' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [vault]
      summary: Store a provider API key (envelope-encrypted)
      operationId: storeVaultKey
      description: >
        Encrypts the provider key with the org's Data Encryption Key (wrapped
        by the environment KEK) and stores it. The response contains only the
        masked preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, apiKey]
              properties:
                provider:
                  type: string
                  enum: [openai, anthropic, gemini, deepseek]
                  description: LLM provider.
                label:
                  type: string
                  description: Human-readable label (defaults to the provider name).
                apiKey:
                  type: string
                  description: The provider API key. Stored encrypted; never returned.
      responses:
        '201':
          description: Stored. Response carries masked metadata only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultEntry' }
        '400':
          description: 'Invalid provider or missing/oversized apiKey (`INVALID_PROVIDER` / `INVALID_API_KEY`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/vault/{id}:
    parameters:
      - $ref: '#/components/parameters/VaultEntryId'
    get:
      tags: [vault]
      summary: Get one vault entry (masked)
      operationId: getVaultKey
      responses:
        '200':
          description: Masked vault entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultEntry' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [vault]
      summary: Delete a vault entry (Owner only)
      operationId: deleteVaultKey
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, const: true }
                  id: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Increment 3: ecosystem catalog + Grill-Me SSE -----------------------
  # Catalog routes are read-only and require a session (any org — the catalog
  # is global MIT content). Writes are operator-only via the sync CLI, never
  # over HTTP.
  /api/catalog:
    get:
      tags: [catalog]
      summary: List catalog sources with their pinned versions
      description: |
        Returns the latest sync state of every catalog source
        (agency-agents personas, nuwa-skill lenses): pinned version, status,
        summary, and whether good data is installed and being served. Drives
        the marketplace version badges.
      operationId: listCatalogSources
      responses:
        '200':
          description: Catalog source states (one entry per configured source).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogSource' }
  /api/catalog/personas:
    get:
      tags: [catalog]
      summary: Persona catalog grouped by division (Agent Marketplace)
      operationId: getPersonaCatalog
      responses:
        '200':
          description: Personas grouped by division with tool permission tags.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonaCatalog' }
        '404':
          description: The marketplace has not been synced yet (`CATALOG_EMPTY`).
  /api/catalog/divisions:
    get:
      tags: [catalog]
      summary: Division metadata (marketplace grouping keys)
      operationId: listDivisions
      responses:
        '200':
          description: Division id/label/icon/color entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Division' }
  /api/catalog/agents:
    get:
      tags: [catalog]
      summary: List personas with division + tool permission tags
      operationId: listAgents
      parameters:
        - name: division
          in: query
          schema: { type: string }
          description: Filter by division id (e.g. `engineering`).
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive search over name, description, vibe.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Persona records (latest good snapshot).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Persona' }
  /api/catalog/agents/{id}:
    get:
      tags: [catalog]
      summary: Fetch one persona (tool tags + markdown body)
      operationId: getAgent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 'Full persona id, e.g. `agency-agents:engineering/backend-architect`.'
      responses:
        '200':
          description: The persona record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Persona' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/lenses:
    get:
      tags: [catalog]
      summary: List cognitive perspective lenses
      operationId: listLenses
      responses:
        '200':
          description: Lens records from the latest good nuwa-skill snapshot.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lens' }
  /api/catalog/lenses/{id}:
    get:
      tags: [catalog]
      summary: Fetch one lens (body + FIDELITY scorecard)
      operationId: getLens
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: 'Full lens id, e.g. `nuwa-skill:munger-perspective`.'
      responses:
        '200':
          description: The lens record (fidelity present when a scorecard exists).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lens' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/catalog/snapshots:
    get:
      tags: [catalog]
      summary: Catalog sync provenance (snapshot history)
      operationId: listSnapshots
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: string, enum: [agency-agents, nuwa-skill] }
      responses:
        '200':
          description: Snapshot rows, newest first (ok + failed attempts).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogSnapshot' }
  /api/catalog/{source}:
    parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
          enum: [agency-agents, nuwa-skill]
    get:
      tags: [catalog]
      summary: Source alias — persona marketplace or lens catalog
      description: |
        `agency-agents` returns the persona catalog grouped by division;
        `nuwa-skill` returns the cognitive perspective lenses. Always serves
        the last-known-good snapshot.
      operationId: getCatalog
      responses:
        '200':
          description: Catalog payload.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/PersonaCatalog' }
                  - { $ref: '#/components/schemas/LensCatalog' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/skills/check-updates:
    get:
      tags: [catalog]
      summary: Report pinned versions for the marketplace badges
      description: |
        Reports, per source, the currently pinned version and sync state —
        the frontend's staleness check. The nightly sync CLI advances the
        pin; this endpoint only reports current state.
      operationId: checkCatalogUpdates
      responses:
        '200':
          description: Per-source pinned-version report.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogSource' }
  /api/grill/stream:
    post:
      tags: [grill]
      summary: Open (or resume) the realtime Grill-Me SSE loop
      description: |
        Authenticated (Architect+). Opens a Server-Sent Events stream that
        interrogates ONE question at a time: `session` (identity + guardrail
        counters), `progress` (coverage), `question`, then `ready` +
        `compiled` (Python workflow) + `done` when the spec is covered.
        Answers are posted to `POST /api/grill/stream/{sessionId}/answers`.
        Turn (≤ 5) and token (≤ 15,000) ceilings are enforced in the service
        layer and surfaced as `limit` events / HTTP 429 — they cannot be
        bypassed by calling the API directly.
      operationId: openGrillStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: The workflow brief to interrogate (new session).
                projectId:
                  type: string
                  format: uuid
                  description: Attach the session to an existing project.
                sessionId:
                  type: string
                  description: Resume an existing session (replays its transcript).
      responses:
        '200':
          description: 'SSE event stream (`text/event-stream`).'
          content:
            text/event-stream:
              schema:
                type: string
                description: '`event: session|progress|question|ready|compiled|limit|done` frames, JSON `data` payloads.'
        '400':
          description: Missing prompt (`INVALID_PROMPT`).
        '404':
          description: Unknown session id on resume (`NOT_FOUND`).
        '429':
          description: Too many active sessions for the workspace (`TOO_MANY_SESSIONS`).
  /api/grill/stream/{sessionId}/answers:
    post:
      tags: [grill]
      summary: Answer the current grill question
      operationId: answerGrillStream
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answerId: { type: string, description: 'The question id from the last `question` event.' }
                text: { type: string }
              required: [answerId, text]
      responses:
        '200':
          description: Session state (counters + next position).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrillStreamState' }
        '400':
          description: Malformed answer (`INVALID_ANSWER`).
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Session closed (`SESSION_CLOSED`).
        '429':
          description: Ceiling reached (`GRILL_LIMIT`) — turn or token budget exhausted.
  /api/grill/stream/{sessionId}:
    get:
      tags: [grill]
      summary: Read a grill stream session's state (reconnect probe)
      operationId: getGrillStreamState
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session state JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrillStreamState' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/workflow/simulate:
    post:
      tags: [workflow]
      summary: SAFE execution preview (static validation + mock simulation)
      description: |
        Statically validates the DAG and runs a topological simulation with
        mock handlers. NO user code ever executes on the server — input URLs
        are never fetched, agent steps return canned templates, outputs are
        placeholders (see server/test/safety.test.js for the invariant).
      operationId: simulateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow: { $ref: '#/components/schemas/Workflow' }
              required: [workflow]
      responses:
        '200':
          description: Simulation result (steps with mock outputs).
          content:
            application/json:
              schema:
                type: object
                properties:
                  simulation: { type: boolean, const: true }
                  success: { type: boolean }
                  error: { type: string, nullable: true }
                  errors: { type: array, items: { type: string } }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        output:
                          type: object
                          additionalProperties: true
                  note: { type: string }

  /api/workflow/preflight:
    post:
      tags: [workflow]
      summary: Static pre-flight AST validation (publish gate)
      description: |
        Runs the full static gate over a workflow: structural DAG checks
        (cycles, dangling refs, duplicate ids), reachability analysis
        (islands, unreachable nodes, dead ends), schema parameter matching
        per node type, tool-boundary constraints against the marketplace
        allow-list, and the security boundary reassertion. Pure static
        analysis — nothing is executed.
      operationId: preflightWorkflow
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflow: { $ref: '#/components/schemas/Workflow' }
              required: [workflow]
      responses:
        '200':
          description: Pre-flight report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  summary: { type: string }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        message: { type: string }
                        nodeId: { type: string }
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        message: { type: string }
                        nodeId: { type: string }
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        passed: { type: boolean }
                        count: { type: integer }
                  security:
                    type: object
                    properties:
                      executedCode: { type: boolean, const: false }
                      boundary: { type: string }
                      blocked: { type: array, items: { type: string } }

  # --- GitHub publishing (Increment 4) -------------------------------------
  /api/github/auth-url:
    get:
      tags: [publish]
      summary: Start the GitHub OAuth dance (repo scope)
      description: |
        Creates a single-use state nonce bound to the caller's org and
        returns the GitHub authorize URL. The client opens it in a popup;
        GitHub redirects to /api/github/callback.
      operationId: githubAuthUrl
      security: [{ bearerAuth: [] }]
      parameters:
        - name: redirect_uri
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: GitHub authorize URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '503':
          description: GitHub OAuth not configured (GITHUB_CLIENT_ID missing).
  /api/github/callback:
    get:
      tags: [publish]
      summary: GitHub OAuth callback (public)
      description: |
        Public endpoint (GitHub carries no session token). Consumes the
        single-use state nonce, exchanges the code for a token, stores the
        sealed token against the org, and renders an HTML page that
        postMessages the outcome to the opener popup and closes.
      operationId: githubOAuthCallback
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML popup-closing page.
  /api/github/status:
    get:
      tags: [publish]
      summary: GitHub connection status + recent publications
      operationId: githubStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Connection status (never exposes the token).
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  login: { type: string, nullable: true }
                  scopes: { type: array, items: { type: string } }
                  connectedAt: { type: string, nullable: true }
                  publications:
                    type: array
                    items: { $ref: '#/components/schemas/Publication' }
  /api/github/repos:
    get:
      tags: [publish]
      summary: List the connected account's repositories (repo scope)
      operationId: githubListRepos
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Repository listing.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    full_name: { type: string }
                    html_url: { type: string }
                    private: { type: boolean }
                    default_branch: { type: string }
  /api/github/repos/{owner}/{repo}/contents:
    get:
      tags: [publish]
      summary: Read a path inside a repository (contents API)
      operationId: githubGetContents
      security: [{ bearerAuth: [] }]
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string }
        - name: repo
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: File or directory listing from the GitHub contents API.
  /api/github/connection:
    delete:
      tags: [publish]
      summary: Disconnect the org's GitHub account
      operationId: githubDisconnect
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Connection removed.
        '404':
          description: No connection to remove.
  /api/projects/{id}/publish:
    post:
      tags: [publish]
      summary: Publish a project's workflow to GitHub (Team tier)
      description: |
        Pre-flight validates the workflow, the hexagonal codegen compiles
        the Python project, spec.yaml + workflow.json are scaffolded, a
        repository is created in the user's account, and the file tree is
        pushed via the git data API. Requires an active Team subscription or
        trial (Free tier answers 402 PAYMENT_REQUIRED).
      operationId: publishProject
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repoName: { type: string, description: '1-100 chars: letters, digits, . _ - (cannot start with a dot)' }
                description: { type: string }
                private: { type: boolean, default: true }
                branch: { type: string, default: main }
              required: [repoName]
      responses:
        '200':
          description: Publish result with the repository URL and ledger row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repoUrl: { type: string }
                  sha: { type: string }
                  branch: { type: string }
                  latencyMs: { type: integer }
                  fileCount: { type: integer }
                  summary: { type: string }
                  publication: { $ref: '#/components/schemas/Publication' }
        '402':
          description: Team subscription or trial required.
        '422':
          description: Pre-flight validation failed or invalid repo name.
  /api/projects/{id}/publications:
    get:
      tags: [publish]
      summary: Publication ledger for a project
      operationId: listPublications
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Publication rows (newest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Publication' }

  # --- Stripe billing (Increment 4) ----------------------------------------
  /api/billing/webhook:
    post:
      tags: [billing]
      summary: Stripe webhook (public, signature-verified)
      description: |
        Receives Stripe events on the RAW body. The signature is verified
        against the `stripe-signature` header; event ids are deduplicated in
        the billing_events ledger; subscription state is re-fetched from
        Stripe so out-of-order delivery cannot regress the row.
      operationId: stripeWebhook
      responses:
        '200':
          description: Event acknowledged (processed or duplicate).
        '400':
          description: Signature verification failed.
  /api/billing:
    get:
      tags: [billing]
      summary: Current subscription state for the org
      operationId: getBilling
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Billing row (never exposes Stripe internals).
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId: { type: string }
                  configured: { type: boolean }
                  plan: { type: string }
                  status: { type: string }
                  statusLabel: { type: string }
                  trialEnd: { type: string, nullable: true }
                  currentPeriodEnd: { type: string, nullable: true }
                  cancelAtPeriodEnd: { type: boolean }
  /api/billing/entitlement:
    get:
      tags: [billing]
      summary: Effective tier + usage quota for the current period
      description: |
        Resolves the org's effective tier (free | trial | team) from the
        subscription state and reports the monthly Grill usage. Drives the
        plan badge and the quota gates.
      operationId: getEntitlement
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Entitlement snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgId: { type: string }
                  tier: { type: string, enum: [free, trial, team] }
                  label: { type: string }
                  limits:
                    type: object
                    properties:
                      grillSessionsPerMonth: { type: integer, nullable: true }
                      exports: { type: boolean }
                      unlimitedGrill: { type: boolean }
                      preview: { type: string, enum: [mock, simulated] }
                  usage:
                    type: object
                    properties:
                      grillSessionsThisMonth: { type: integer }
                  billing:
                    type: object
                    properties:
                      plan: { type: string }
                      status: { type: string }
                      trialEnd: { type: string, nullable: true }
                      currentPeriodEnd: { type: string, nullable: true }
  /api/billing/checkout:
    post:
      tags: [billing]
      summary: Create a Stripe Checkout session for the Team tier
      operationId: createCheckoutSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                successUrl: { type: string }
                cancelUrl: { type: string }
                tierId: { type: string, default: team }
              required: [successUrl, cancelUrl]
      responses:
        '200':
          description: Checkout session URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, nullable: true }
                  sessionId: { type: string }
        '503':
          description: Stripe not configured.
  /api/billing/portal:
    post:
      tags: [billing]
      summary: Stripe billing portal link for the org's customer
      operationId: createPortalLink
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                returnUrl: { type: string }
      responses:
        '200':
          description: Portal URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
        '409':
          description: No Stripe customer yet.

  # --- Telemetry (Increment 4) ----------------------------------------------
  /api/telemetry/events:
    post:
      tags: [telemetry]
      summary: Capture one analytics event (privacy-preserving)
      description: |
        Client-side capture (lens selections, agent drops). The server
        allowlists every property (prompt text, API keys and free-form
        content are structurally dropped) and pseudonymizes the org id.
      operationId: captureTelemetryEvent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event: { type: string }
                props:
                  type: object
                  additionalProperties: true
              required: [event]
      responses:
        '200':
          description: Event captured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured: { type: boolean, const: true }
                  event: { type: string }
        '400':
          description: Missing event name.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token (verified against Clerk's JWKS).

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Project id (UUID).
    VaultEntryId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Vault entry id (`vk_…`).

  responses:
    NotFound:
      description: The referenced resource does not exist in this org (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid session token (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        Authenticated but not permitted — either no org binding (`ORG_REQUIRED`)
        or insufficient role for the operation (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded], example: ok }
        service: { type: string, example: '@ai-workflow-builder/server' }
        version: { type: string, example: 0.1.0 }
        uptime: { type: integer, description: Process uptime in whole seconds., example: 42 }
        timestamp: { type: string, format: date-time }
        db:
          type: object
          description: Live database readiness check.
          properties:
            ok: { type: boolean, description: Whether the storage layer answered a ping. }
            latencyMs: { type: number, description: Ping round-trip in milliseconds (0 for in-memory). }
            error: { type: string, description: Present only when ok is false. }
          required: [ok]
      required: [status, db]

    Error:
      type: object
      description: Uniform error envelope emitted by the HTTP adapter.
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          examples: [INVALID_PROMPT, INVALID_ANSWERS, NOT_FOUND, SPEC_NOT_READY, INVALID_WORKFLOW, INTERNAL]
        message: { type: string }
        details:
          description: Optional structured detail (e.g. the list of workflow validation errors).
      required: [error, message]

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string }
        answers:
          type: object
          additionalProperties: { type: string }
          description: Map of questionId → answer gathered so far.
        spec:
          oneOf:
            - { $ref: '#/components/schemas/Spec' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, prompt, answers, createdAt, updatedAt]

    Spec:
      type: object
      description: Structured spec re-derived from (prompt, answers). Downstream reads this, never the raw prompt.
      properties:
        goal: { type: string }
        why: { type: string }
        inputs: { type: array, items: { type: string } }
        outputs: { type: array, items: { type: string } }
        constraints: { type: array, items: { type: string } }
        successCriteria: { type: array, items: { type: string } }
        edgeCases: { type: array, items: { type: string } }
        ready:
          type: boolean
          description: True when every *critical* dimension is covered.
        openQuestions:
          type: array
          items: { type: string }
          description: Human-readable labels of dimensions still uncovered.
      required: [goal, ready, openQuestions]

    Question:
      type: object
      properties:
        id: { type: string, description: 'Stable, dimension-scoped id (e.g. "goal.outcome").' }
        dimension: { type: string }
        prompt: { type: string }
        critical:
          type: boolean
          description: If true, the spec is not ready until this is answered.
      required: [id, dimension, prompt, critical]

    GrillResult:
      type: object
      description: >
        Result of the grill step. `coverage` is a per-dimension boolean map (the
        deterministic readiness breakdown), keyed by dimension id.
      properties:
        projectId: { type: string, format: uuid }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        ready: { type: boolean }
        missing:
          type: array
          items: { type: string }
          description: Ids of uncovered *critical* dimensions (block readiness).
        warnings:
          type: array
          items: { type: string }
          description: Ids of uncovered non-critical dimensions.
        coverage:
          type: object
          additionalProperties: { type: boolean }
          description: dimensionId → covered?.
      required: [projectId, questions, ready, missing, warnings, coverage]

    Workflow:
      type: object
      properties:
        id: { type: string, example: wf_9f1c… }
        name: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/WorkflowNode' }
      required: [nodes]

    WorkflowNode:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [input, agent, tool, branch, output]
        name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: Node-type-specific configuration (sources, objective, constraints, …).
        dependsOn:
          type: array
          items: { type: string }
          description: Ids of nodes this node depends on. Must resolve; graph must be acyclic.
      required: [id, type]

    VaultEntry:
      type: object
      description: >
        Public (masked) view of a stored provider key. Contains only labels and
        metadata — never the plaintext key and never the wrapped material.
      properties:
        id: { type: string, example: vk_9f1c… }
        provider:
          type: string
          enum: [openai, anthropic, gemini, deepseek]
        label: { type: string }
        keyHandle: { type: string, example: kh_2b4d… }
        maskedKey: { type: string, example: sk-proj-ab…9f2c }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, provider, label, keyHandle, maskedKey]

    # --- Increment 3: catalog schemas ---------------------------------------
    CatalogSource:
      type: object
      description: Latest sync state of one catalog source.
      properties:
        source: { type: string, example: agency-agents }
        version: { type: string, nullable: true, example: bundle-agency-agents }
        status:
          type: string
          enum: [ok, failed, never-synced]
          description: Status of the LATEST sync attempt (ok even when a newer attempt failed, if good data is installed).
        ok:
          type: boolean
          description: Whether good data is installed and being served.
        summary: { type: string, nullable: true }
        error: { type: string, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }

    CatalogSnapshot:
      type: object
      description: One catalog sync attempt (provenance).
      properties:
        id: { type: string, example: 'agency-agents@bundle-agency-agents' }
        source: { type: string }
        version: { type: string }
        status: { type: string, enum: [ok, partial, failed] }
        summary: { type: string }
        error: { type: string, nullable: true }
        syncedAt: { type: string, format: date-time }

    Division:
      type: object
      description: One marketplace division (from divisions.json).
      properties:
        id: { type: string, example: engineering }
        label: { type: string, example: Engineering }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }

    Persona:
      type: object
      description: One agency-agents persona (immutable id + tool permission tags).
      properties:
        id: { type: string, example: 'agency-agents:engineering/backend-architect' }
        source: { type: string, const: agency-agents }
        version: { type: string, description: Pinned catalog version this row came from. }
        division: { type: string, example: engineering }
        divisionLabel: { type: string, example: Engineering }
        slug: { type: string, example: backend-architect }
        name: { type: string }
        description: { type: string }
        emoji: { type: string, nullable: true }
        color: { type: string, nullable: true }
        vibe: { type: string, nullable: true }
        tools:
          type: array
          items: { type: string }
          description: Tool permission tags (ids from the mirror's tools.json).
        body:
          type: string
          description: Markdown personality body after the YAML frontmatter.

    PersonaDivision:
      type: object
      description: One division bucket of the persona catalog.
      properties:
        id: { type: string, example: engineering }
        label: { type: string }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        agents:
          type: array
          items: { $ref: '#/components/schemas/Persona' }

    PersonaCatalog:
      type: object
      properties:
        source: { type: string, const: agency-agents }
        version: { type: string, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }
        divisions:
          type: array
          items: { $ref: '#/components/schemas/PersonaDivision' }

    Lens:
      type: object
      description: One nuwa-skill cognitive perspective lens.
      properties:
        id: { type: string, example: 'nuwa-skill:munger-perspective' }
        source: { type: string, const: nuwa-skill }
        version: { type: string, description: Pinned catalog version this row came from. }
        slug: { type: string, example: munger-perspective }
        name: { type: string }
        description: { type: string }
        fidelity: { type: string, nullable: true, description: FIDELITY.md scorecard body when present. }
        body: { type: string, description: SKILL.md body after the YAML frontmatter. }

    LensCatalog:
      type: object
      properties:
        source: { type: string, const: nuwa-skill }
        version: { type: string, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }
        lenses:
          type: array
          items: { $ref: '#/components/schemas/Lens' }

    GrillStreamState:
      type: object
      description: JSON snapshot of a grill stream session (answers route + GET probe).
      properties:
        sessionId: { type: string }
        projectId: { type: string, format: uuid }
        prompt: { type: string }
        answers:
          type: object
          additionalProperties: { type: string }
        turn: { type: integer }
        turnsUsed: { type: integer }
        turnsRemaining: { type: integer }
        tokensUsed: { type: integer }
        tokensRemaining: { type: integer }
        state: { type: string, enum: [open, closed] }
        closedReason: { type: string, nullable: true }
