openapi: 3.1.0
info:
  title: ai-workflow-builder API
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    HTTP contract for the `@ai-workflow-builder/server` Express 4 service that
    powers workflow-builders.com.

    Turn a single natural-language prompt into a validated multi-agent workflow.
    Ambiguity is resolved by a deterministic **Grill-Me** spec loop *before* a
    workflow is scaffolded, and workflows are only persisted once they pass the
    aggregate's invariants (unique ids, resolvable dependencies, acyclic).

    This document was regenerated from the actual route table
    (`server/src/adapters/http/routes.js`) and the domain shapes it serves. It
    supersedes the earlier `/api/v1/agents|workflows` design, which described a
    deprecated Python/FastAPI product that no longer exists.

    ## Resource model
    The real aggregate root is a **Project** (`{ prompt, answers, spec }`). Each
    project has at most one compiled **Workflow**. There is no top-level
    `/agents` or `/workflows` collection.

    ## Lifecycle
    `POST /api/projects` (prompt) → `GET .../grill` → `POST .../answers`
    (repeat until `ready: true`) → `POST .../workflow/scaffold` →
    `PUT .../workflow` (edit + validate).

    ## Authentication & tenant isolation
    Every endpoint except `/api/health` requires a Clerk session JWT sent as
    `Authorization: Bearer <session token>`. The server verifies the token
    cryptographically (`@clerk/backend`), extracts the `org_id` claim, and
    scopes every query to that organization — cross-tenant access to a
    resource behaves exactly like a missing resource (HTTP 404). RBAC:
    `org:owner`/`org:admin` = Owner, `org:architect`/`org:editor` = Architect,
    `org:viewer`/`org:member` = Viewer. Writes require Architect+, deletes
    require Owner, and the key vault is Architect+ for all operations.

    ## Key vault
    `POST /api/vault` stores LLM provider keys (OpenAI/Anthropic/Gemini/DeepSeek) with
    envelope encryption: a per-organization Data Encryption Key (DEK) wraps the
    provider key, and the DEK itself is wrapped by an environment Key
    Encryption Key (KEK, `VAULT_KEK`). Read endpoints return **masked labels
    only** (`maskedKey` like `sk-abc…wxyz`); plaintext keys and wrapped
    material never appear in any response.

servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.workflow-builders.com
    description: Production (behind Cloudflare + Clerk edge auth)

tags:
  - name: system
    description: Liveness and operational endpoints
  - name: projects
    description: Project lifecycle (prompt → spec)
  - name: grill
    description: The deterministic Grill-Me clarification loop
  - name: workflow
    description: Compiled workflow scaffold, validation, and persistence
  - name: vault
    description: Envelope-encrypted LLM provider key vault

# Everything except /api/health requires a Clerk session JWT (see
# Authentication above). /api/health overrides with `security: []`.
security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [system]
      summary: Liveness and readiness probe
      operationId: health
      security: []
      description: >
        Returns operational status, service identity, process uptime, and a
        live database readiness check (a `SELECT 1` round-trip on the SQLite
        adapter). Responds 200 while the service can serve traffic and 503
        (status `degraded`) when the database is unreachable, so orchestrators
        (Docker HEALTHCHECK, Fly.io/Railway rolling deploys) can fail over or
        restart the instance. Deliberately public — no session required.
      responses:
        '200':
          description: Service is up and the database answers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Service is up but the database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/projects:
    post:
      tags: [projects]
      summary: Create a project from a one-line prompt
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: The one-line natural-language prompt.
                  example: summarise my emails
      responses:
        '201':
          description: Project created; an initial spec snapshot is derived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: Prompt missing or not a non-empty string (`INVALID_PROMPT`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [projects]
      summary: List all projects
      operationId: listProjects
      responses:
        '200':
          description: Projects, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }

  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      summary: Get a project
      operationId: getProject
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [projects]
      summary: Delete a project (cascades to its workflow)
      operationId: deleteProject
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, const: true }
                  id: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/grill:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [grill]
      summary: Get the next Grill-Me questions and readiness
      operationId: grill
      parameters:
        - name: deep
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
          description: >
            When `true`, also surface non-critical questions for dimensions that
            are already covered. Any value other than the literal string `true`
            is treated as false.
      responses:
        '200':
          description: Open questions plus per-dimension coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrillResult' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/answers:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [grill]
      summary: Submit answers to grill questions
      operationId: answer
      description: >
        Merges the given answers into the project, re-derives the spec, and
        returns the updated project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: object
                  additionalProperties: { type: string }
                  description: Map of questionId → free-text answer.
                  example:
                    goal.outcome: a daily digest
                    inputs.source: my inbox
                    outputs.shape: markdown
                    success.measure: nothing urgent missed
      responses:
        '200':
          description: The updated project with a re-derived spec.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400':
          description: '`answers` is missing or not a plain object (`INVALID_ANSWERS`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/workflow/scaffold:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [workflow]
      summary: Compile the current spec into a starter workflow
      operationId: scaffoldWorkflow
      description: >
        Refuses with 409 unless the spec is ready, protecting against building
        on an under-specified spec. Pass `force: true` to override.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: Scaffold even if the spec is not ready.
      responses:
        '201':
          description: The scaffolded and persisted workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '409':
          description: Spec still has open questions (`SPEC_NOT_READY`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/{id}/workflow:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [workflow]
      summary: Get the project's saved workflow
      operationId: getWorkflow
      responses:
        '200':
          description: The workflow, or `null` if none has been scaffolded/saved yet.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/Workflow' }
                  - { type: 'null' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [workflow]
      summary: Persist a user-edited workflow after validation
      operationId: saveWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow]
              properties:
                workflow: { $ref: '#/components/schemas/Workflow' }
      responses:
        '200':
          description: The persisted workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workflow' }
        '422':
          description: Workflow failed invariant validation (`INVALID_WORKFLOW`). `details` lists every violation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vault:
    get:
      tags: [vault]
      summary: List the org's stored provider keys (masked labels only)
      operationId: listVaultKeys
      description: >
        Returns masked labels and metadata for every vault entry in the
        caller's organization. Plaintext keys and wrapped key material are
        never returned.
      responses:
        '200':
          description: Masked vault entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VaultEntry' }
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [vault]
      summary: Store a provider API key (envelope-encrypted)
      operationId: storeVaultKey
      description: >
        Encrypts the provider key with the org's Data Encryption Key (wrapped
        by the environment KEK) and stores it. The response contains only the
        masked preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, apiKey]
              properties:
                provider:
                  type: string
                  enum: [openai, anthropic, gemini, deepseek]
                  description: LLM provider.
                label:
                  type: string
                  description: Human-readable label (defaults to the provider name).
                apiKey:
                  type: string
                  description: The provider API key. Stored encrypted; never returned.
      responses:
        '201':
          description: Stored. Response carries masked metadata only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultEntry' }
        '400':
          description: 'Invalid provider or missing/oversized apiKey (`INVALID_PROVIDER` / `INVALID_API_KEY`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/vault/{id}:
    parameters:
      - $ref: '#/components/parameters/VaultEntryId'
    get:
      tags: [vault]
      summary: Get one vault entry (masked)
      operationId: getVaultKey
      responses:
        '200':
          description: Masked vault entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VaultEntry' }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [vault]
      summary: Delete a vault entry (Owner only)
      operationId: deleteVaultKey
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean, const: true }
                  id: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk session token (verified against Clerk's JWKS).

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Project id (UUID).
    VaultEntryId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Vault entry id (`vk_…`).

  responses:
    NotFound:
      description: The referenced resource does not exist in this org (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid session token (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        Authenticated but not permitted — either no org binding (`ORG_REQUIRED`)
        or insufficient role for the operation (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded], example: ok }
        service: { type: string, example: '@ai-workflow-builder/server' }
        version: { type: string, example: 0.1.0 }
        uptime: { type: integer, description: Process uptime in whole seconds., example: 42 }
        timestamp: { type: string, format: date-time }
        db:
          type: object
          description: Live database readiness check.
          properties:
            ok: { type: boolean, description: Whether the storage layer answered a ping. }
            latencyMs: { type: number, description: Ping round-trip in milliseconds (0 for in-memory). }
            error: { type: string, description: Present only when ok is false. }
          required: [ok]
      required: [status, db]

    Error:
      type: object
      description: Uniform error envelope emitted by the HTTP adapter.
      properties:
        error:
          type: string
          description: Stable machine-readable error code.
          examples: [INVALID_PROMPT, INVALID_ANSWERS, NOT_FOUND, SPEC_NOT_READY, INVALID_WORKFLOW, INTERNAL]
        message: { type: string }
        details:
          description: Optional structured detail (e.g. the list of workflow validation errors).
      required: [error, message]

    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string }
        answers:
          type: object
          additionalProperties: { type: string }
          description: Map of questionId → answer gathered so far.
        spec:
          oneOf:
            - { $ref: '#/components/schemas/Spec' }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, prompt, answers, createdAt, updatedAt]

    Spec:
      type: object
      description: Structured spec re-derived from (prompt, answers). Downstream reads this, never the raw prompt.
      properties:
        goal: { type: string }
        why: { type: string }
        inputs: { type: array, items: { type: string } }
        outputs: { type: array, items: { type: string } }
        constraints: { type: array, items: { type: string } }
        successCriteria: { type: array, items: { type: string } }
        edgeCases: { type: array, items: { type: string } }
        ready:
          type: boolean
          description: True when every *critical* dimension is covered.
        openQuestions:
          type: array
          items: { type: string }
          description: Human-readable labels of dimensions still uncovered.
      required: [goal, ready, openQuestions]

    Question:
      type: object
      properties:
        id: { type: string, description: 'Stable, dimension-scoped id (e.g. "goal.outcome").' }
        dimension: { type: string }
        prompt: { type: string }
        critical:
          type: boolean
          description: If true, the spec is not ready until this is answered.
      required: [id, dimension, prompt, critical]

    GrillResult:
      type: object
      description: >
        Result of the grill step. `coverage` is a per-dimension boolean map (the
        deterministic readiness breakdown), keyed by dimension id.
      properties:
        projectId: { type: string, format: uuid }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }
        ready: { type: boolean }
        missing:
          type: array
          items: { type: string }
          description: Ids of uncovered *critical* dimensions (block readiness).
        warnings:
          type: array
          items: { type: string }
          description: Ids of uncovered non-critical dimensions.
        coverage:
          type: object
          additionalProperties: { type: boolean }
          description: dimensionId → covered?.
      required: [projectId, questions, ready, missing, warnings, coverage]

    Workflow:
      type: object
      properties:
        id: { type: string, example: wf_9f1c… }
        name: { type: string }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/WorkflowNode' }
      required: [nodes]

    WorkflowNode:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [input, agent, tool, branch, output]
        name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: Node-type-specific configuration (sources, objective, constraints, …).
        dependsOn:
          type: array
          items: { type: string }
          description: Ids of nodes this node depends on. Must resolve; graph must be acyclic.
      required: [id, type]

    VaultEntry:
      type: object
      description: >
        Public (masked) view of a stored provider key. Contains only labels and
        metadata — never the plaintext key and never the wrapped material.
      properties:
        id: { type: string, example: vk_9f1c… }
        provider:
          type: string
          enum: [openai, anthropic, gemini, deepseek]
        label: { type: string }
        keyHandle: { type: string, example: kh_2b4d… }
        maskedKey: { type: string, example: sk-proj-ab…9f2c }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, provider, label, keyHandle, maskedKey]
