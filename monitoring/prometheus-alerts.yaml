groups:
  - name: ai-workflow-builder-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{job="ai-workflow-builder",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="ai-workflow-builder"}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate > 5% for the AI Workflow Builder service over the last 5 minutes."
      - alert: HighLatency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job="ai-workflow-builder"}[5m])) by (le)) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency observed"
          description: "99th percentile latency > 300ms for the AI Workflow Builder service."
